# Serveur perso (VPS) : NodeCG + Caddy (HTTPS automatique Let's Encrypt)
# 1. Copier .env.example en .env et le remplir  2. docker compose up -d --build
services:
  nodecg:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - nodecg-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9090/login').then((r) => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${NODECG_BASE_URL:?NODECG_BASE_URL manquant dans .env} --to nodecg:9090
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [nodecg]
volumes:
  nodecg-data:
  caddy-data:
  caddy-config:
