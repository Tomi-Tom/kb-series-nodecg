<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<title>Veto des maps</title>
	<!--
		Panneau Veto : déroulé du veto map par map (ban / pick / decider, choix du côté, annulation), séquence prévue et pool de maps.
		Écrit les replicants `veto` (étapes jouées, pool) et `matchVeto` (préréglage et séquence prévue) ;
		affiche / masque Veto, Versus et Récap du veto via KBO (replicant `matchGraphics`). N'envoie aucun message.
	-->
	<link rel="stylesheet" href="../shared/dashboard.css">
	<style>
		#ovBox { margin-top: 0; padding: 4px; }
		#ovBox .name { font-weight: 600; }
		.now { margin-top: 10px; padding: 10px 12px; border-radius: 6px; background: var(--panel-2); border-left: 4px solid var(--c, var(--gold)); }
		.now .k { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
		.now .v { font-size: 20px; font-weight: 800; margin-top: 2px; }
		.now .v .ban { color: var(--red); } .now .v .pick { color: var(--c); } .now .v .decider { color: var(--gold); }
		.maps { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; margin-top: 8px; }
		.mb { position: relative; height: 64px; padding: 0; overflow: hidden; border: 2px solid var(--line); background: #000 var(--img, none) center / cover no-repeat; text-align: left; }
		.mb::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10, 15, 46, .85), rgba(10, 15, 46, .3)); }
		.mb > * { position: relative; }
		.mb .nm { display: block; padding: 0 10px; font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
		.mb .st { display: block; padding: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
		.mb:not(:disabled):hover { border-color: var(--c, var(--gold)); }
		.mb.ban { filter: grayscale(1); opacity: .55; border-color: rgba(255, 70, 85, .6); }
		.mb.ban .st { color: var(--red); }
		.mb.pick { border-color: var(--c); } .mb.pick .st { color: #fff; }
		.mb.decider { border-color: var(--gold); } .mb.decider .st { color: var(--gold); }
		.mb:disabled { cursor: default; opacity: 1; }
		.mb.ban:disabled { opacity: .55; }
		.mb.off:disabled { opacity: .45; }
		.side { margin-top: 8px; padding: 10px; border: 1px solid var(--gold); border-radius: 6px; background: rgba(201, 178, 116, .08); }
		.side .q { font-weight: 700; }
		.seg { display: flex; gap: 4px; margin-top: 6px; }
		.seg button { flex: 1; }
		.hist { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
		.hs { display: flex; gap: 8px; align-items: center; font-size: 12px; padding: 4px 8px; background: var(--panel); border-radius: 4px; }
		.hs .i { color: var(--muted); width: 18px; }
		.hs .a { width: 58px; font-weight: 800; text-transform: uppercase; font-size: 11px; letter-spacing: .08em; }
		.hs .a.ban { color: var(--red); } .hs .a.pick { color: var(--blue); } .hs .a.decider { color: var(--gold); }
		.hs .m { flex: 1; font-weight: 700; }
		.hs.todo { opacity: .45; }
		.seq { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
		.sq { display: grid; grid-template-columns: 22px 1fr 1fr 30px; gap: 6px; align-items: center; }
		.sq span { font-size: 11px; color: var(--muted); text-align: center; }
		.sq select { padding: 4px 6px; }
		.pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 2px 8px; margin-top: 6px; }
		.pool label { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--text); font-size: 13px; cursor: pointer; }
		.sq button.x { padding: 3px 8px; }
		.mt0 { margin-top: 0; }
		.ptitle { font-size: 12px; color: var(--muted); margin: 0 0 3px; }
	</style>
</head>
<body>
	<!-- Écrans du veto : AFFICHER / ● À L'ANTENNE -->
	<div class="card" id="ovBox"></div>

	<div class="now" id="now"></div>
	<div id="sideBox"></div>
	<div class="maps" id="maps"></div>
	<div class="row">
		<button id="undo">↶ Annuler la dernière étape</button>
		<button class="danger shrink" id="reset">Réinitialiser le veto</button>
	</div>
	<div class="msg" id="msg"></div>

	<h3>Déroulé</h3>
	<div class="hist" id="hist"></div>

	<details id="cfg">
		<summary>Format du veto &amp; pool de maps</summary>
		<div class="card">
			<label for="preset">Préréglage</label>
			<div class="row mt0">
				<select id="preset"><option value="bo1">BO1 — ban ×6 + decider</option><option value="bo3">BO3 — ban, ban, pick, pick, ban, ban, decider</option><option value="bo5">BO5 — ban, ban, pick ×4, decider</option></select>
				<button class="shrink" id="applyPreset">Appliquer</button>
			</div>
			<div class="hint" id="seqHint"></div>
			<div class="seq" id="seq"></div>
			<div class="row"><button id="addStep" class="shrink">+ Étape</button><span></span></div>
		</div>
		<div class="card">
			<div class="ptitle">Pool de maps (<span id="poolCount"></span>)</div>
			<div class="pool" id="pool"></div>
			<div class="hint">Les maps viennent de valorant-api (replicant valorantData). L'ordre d'affichage suit l'ordre alphabétique.</div>
		</div>
	</details>

	<script src="../shared/kb.js"></script>
	<script src="../shared/match.js"></script>
	<script src="../shared/dash.js"></script>
	<script src="../shared/overlays.js"></script>
	<script>
		const M = window.KBMatch;
		const plan = nodecg.Replicant('matchVeto', { defaultValue: KB.clone(M.MATCH_DEFAULTS.matchVeto) });
		const $ = KB.$, esc = KB.esc;
		const veto = () => KB.rep.veto.value;
		const teamOf = (k) => KB.team(k === 'A' ? KB.rep.match.value.teamA : k === 'B' ? KB.rep.match.value.teamB : null);
		const tag = (k) => { const t = teamOf(k); return t ? t.tag || t.name : 'Équipe ' + k; };
		const color = (k) => KB.teamColor(teamOf(k), k);
		const sideTeamOf = (steps, i) => steps[i].sideTeam || M.defaultSideTeam(steps, i);

		const msg = (text, kind = '') => KBD.flash('msg', text, kind, 5000);

		/* ---------- Écrans (exclusivité gérée par KBO) ---------- */
		const OVERLAYS = ['veto', 'versus', 'veto-recap'];
		KBO.bind('#ovBox');
		KB.watch(KBO.repNames(), () => { $('#ovBox').innerHTML = OVERLAYS.map((id) => KBO.row(id)).join(''); });

		/* ---------- Déroulé ---------- */
		function state() { return M.vetoState(veto(), plan.value.sequence || []); }

		function render() {
			const v = veto(), steps = v.steps || [], seq = plan.value.sequence || [];
			const st = state();
			const now = $('#now');
			// Étape en cours
			if (st.pendingSide >= 0) {
				const s = steps[st.pendingSide], k = sideTeamOf(steps, st.pendingSide);
				now.style.setProperty('--c', color(k));
				now.innerHTML = `<div class="k">Choix du côté</div><div class="v">${esc(tag(k))} choisit son côté sur ${esc(s.map)}</div>`;
			} else if (st.next) {
				const n = st.next;
				now.style.setProperty('--c', n.team ? color(n.team) : 'var(--gold)');
				now.innerHTML = `<div class="k">Étape ${st.index + 1} / ${seq.length}</div><div class="v">${n.team ? esc(tag(n.team)) + ' — ' : ''}<span class="${n.action}">${n.action === 'decider' ? 'Map decider' : M.ACTION_FR[n.action]}</span></div>`;
			} else {
				now.style.setProperty('--c', 'var(--ok)');
				const order = steps.filter((s) => s.action !== 'ban' && s.map).map((s) => s.map);
				now.innerHTML = `<div class="k">Veto terminé</div><div class="v">${esc(order.join(' · ') || '—')}</div>`;
			}

			// Choix du côté
			if (st.pendingSide >= 0) {
				const i = st.pendingSide, s = steps[i], k = sideTeamOf(steps, i);
				$('#sideBox').innerHTML = `<div class="side"><div class="q">Côté sur ${esc(s.map)} — choisi par :</div>
					<div class="seg">${['A', 'B'].map((x) => `<button data-st="${x}" class="${x === k ? 'active' : ''}">${esc(tag(x))}</button>`).join('')}</div>
					<div class="seg"><button class="primary" data-side="attack">${esc(tag(k))} en ATTAQUE</button><button class="primary" data-side="defense">${esc(tag(k))} en DÉFENSE</button></div></div>`;
			} else $('#sideBox').innerHTML = '';

			// Grille des maps
			const blocked = st.pendingSide >= 0 || !st.next;
			const pool = v.pool || [];
			$('#maps').innerHTML = pool.map((m) => {
				const i = steps.findIndex((s) => s.map === m);
				const s = steps[i];
				const d = KB.map(m);
				let cls = 'mb', label = 'Disponible';
				if (s) {
					cls += ' ' + s.action;
					label = s.action === 'ban' ? `Ban ${tag(s.team)}` : s.action === 'pick' ? `Pick ${tag(s.team)}` : 'Decider';
					if (s.action !== 'ban' && s.side) label += ` · ${tag(sideTeamOf(steps, i))} ${s.side === 'attack' ? 'ATK' : 'DEF'}`;
				} else if (blocked) cls += ' off';
				const c = s ? (s.team ? color(s.team) : 'var(--gold)') : st.next && st.next.team ? color(st.next.team) : 'var(--gold)';
				return `<button class="${cls}" data-map="${esc(m)}" ${s || blocked ? 'disabled' : ''} style="--c:${esc(c)};${d ? `--img:url('${esc(d.listView)}')` : ''}"><span class="nm">${esc(m)}</span><span class="st">${esc(label)}</span></button>`;
			}).join('') || '<div class="empty">Pool vide : ouvre « Format du veto & pool de maps ».</div>';

			$('#undo').disabled = !steps.length;

			// Historique + étapes à venir
			const rows = seq.map((p, i) => {
				const s = steps[i];
				if (s) {
					const side = s.action !== 'ban' ? (s.side ? ` — ${tag(sideTeamOf(steps, i))} en ${M.SIDE_FR[s.side].toLowerCase()}` : ' — côté à choisir') : '';
					return `<div class="hs"><span class="i">${i + 1}</span><span class="a ${s.action}">${M.ACTION_FR[s.action] || s.action}</span><span class="m">${esc(s.map || '—')}${esc(side)}</span><span>${s.team ? esc(tag(s.team)) : ''}</span></div>`;
				}
				return `<div class="hs todo"><span class="i">${i + 1}</span><span class="a ${p.action}">${M.ACTION_FR[p.action]}</span><span class="m">…</span><span>${p.team ? esc(tag(p.team)) : ''}</span></div>`;
			});
			// étapes jouées au-delà de la séquence prévue (séquence modifiée en cours de route)
			for (let i = seq.length; i < steps.length; i++) rows.push(`<div class="hs"><span class="i">${i + 1}</span><span class="a ${steps[i].action}">${M.ACTION_FR[steps[i].action]}</span><span class="m">${esc(steps[i].map || '—')}</span></div>`);
			$('#hist').innerHTML = rows.join('');

			safeRenderCfg();
		}

		function addStep(map) {
			const st = state();
			if (!st.next || st.pendingSide >= 0) return;
			const steps = veto().steps;
			const step = { action: st.next.action, team: st.next.action === 'decider' ? null : st.next.team, map, side: null, sideTeam: null };
			if (step.action !== 'ban') step.sideTeam = M.defaultSideTeam([...steps, step], steps.length);
			steps.push(step);
		}
		$('#maps').addEventListener('click', (e) => { const b = e.target.closest('.mb'); if (b && !b.disabled) addStep(b.dataset.map); });
		$('#sideBox').addEventListener('click', (e) => {
			const st = state(); if (st.pendingSide < 0) return;
			const s = veto().steps[st.pendingSide];
			const b = e.target.closest('button'); if (!b) return;
			if (b.dataset.st) s.sideTeam = b.dataset.st;
			if (b.dataset.side) { s.sideTeam = sideTeamOf(veto().steps, st.pendingSide); s.side = b.dataset.side; }
		});
		$('#undo').onclick = () => {
			const steps = veto().steps; const last = steps[steps.length - 1];
			if (!last) return;
			if (last.action !== 'ban' && last.side) { last.side = null; msg('Choix du côté annulé.'); }
			else { steps.pop(); msg(`Étape annulée : ${M.ACTION_FR[last.action]} ${last.map || ''}.`); }
		};
		KBD.confirm('#reset', () => { veto().steps = []; msg('Veto réinitialisé.', 'ok'); }, { label: 'Effacer tout le veto ?' });

		/* ---------- Configuration ---------- */
		// Le menu Préréglage ne suit le replicant que lorsque celui-ci change : un choix en attente d'« Appliquer » est gardé
		let shownFormat = null;
		function renderCfg() {
			const seq = plan.value.sequence || [];
			if (plan.value.format !== shownFormat) { shownFormat = plan.value.format; $('#preset').value = shownFormat || 'bo3'; }
			const pool = veto().pool || [];
			$('#seq').innerHTML = seq.map((p, i) => `<div class="sq" data-i="${i}"><span>${i + 1}</span>
				<select data-k="action" aria-label="Action de l'étape ${i + 1}">${['ban', 'pick', 'decider'].map((a) => `<option value="${a}" ${a === p.action ? 'selected' : ''}>${M.ACTION_FR[a]}</option>`).join('')}</select>
				<select data-k="team" aria-label="Équipe de l'étape ${i + 1}" ${p.action === 'decider' ? 'disabled' : ''}>${p.action === 'decider' ? '<option>—</option>' : ['A', 'B'].map((t) => `<option value="${t}" ${t === p.team ? 'selected' : ''}>Équipe ${t} (${esc(tag(t))})</option>`).join('')}</select>
				<button class="x" data-del title="Retirer l'étape">✕</button></div>`).join('');
			const bans = seq.filter((s) => s.action === 'ban').length, chosen = seq.length - bans;
			$('#seqHint').textContent = `${seq.length} étapes (${bans} ban, ${chosen} pick/decider) pour un pool de ${pool.length} maps`
				+ (seq.length > pool.length ? ' — attention : plus d\'étapes que de maps !' : seq.length < pool.length ? ` — ${pool.length - seq.length} map(s) ne seront pas jouées ni bannies.` : '.');
			const all = [...new Set([...KB.mapNames(), ...pool])].sort();
			$('#pool').innerHTML = all.map((m) => `<label><input type="checkbox" value="${esc(m)}" ${pool.includes(m) ? 'checked' : ''}> ${esc(m)}</label>`).join('');
			$('#poolCount').textContent = `${pool.length} sélectionnée${pool.length > 1 ? 's' : ''}`;
		}
		const applyPreset = () => { const f = $('#preset').value; plan.value = { format: f, sequence: KB.clone(M.VETO_PRESETS[f]) }; msg(`Préréglage ${f.toUpperCase()} appliqué.`, 'ok'); };
		// En plein veto, remplacer la séquence demande confirmation
		$('#applyPreset').onclick = (e) => {
			const btn = e.currentTarget;
			if ((veto().steps || []).length || btn.classList.contains('armed')) KBD.arm(btn, applyPreset, { label: 'Veto en cours : remplacer ?' });
			else applyPreset();
		};
		$('#seq').addEventListener('change', (e) => {
			const row = e.target.closest('.sq'); if (!row) return;
			const p = plan.value.sequence[+row.dataset.i];
			p[e.target.dataset.k] = e.target.value;
			if (p.action === 'decider') p.team = null; else if (!p.team) p.team = 'A';
			e.target.blur();
		});
		$('#seq').addEventListener('click', (e) => { const b = e.target.closest('[data-del]'); if (b) plan.value.sequence.splice(+b.closest('.sq').dataset.i, 1); });
		$('#addStep').onclick = () => plan.value.sequence.push({ action: 'ban', team: 'A' });
		$('#pool').addEventListener('change', () => {
			const checked = KB.$$('#pool input:checked').map((i) => i.value);
			veto().pool = checked;
		});

		// Une étape de la séquence en cours de modification n'est pas réécrite sous la souris
		const safeRenderCfg = KBD.deferWhileEditing('#seq', renderCfg);
		KB.watch(['match', 'teams', 'veto', 'valorantData', plan], render);
	</script>
</body>
</html>
