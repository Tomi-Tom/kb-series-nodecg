<!DOCTYPE html>
<html lang="fr" class="kb-graphic">
<head>
	<meta charset="utf-8">
	<title>Maps de la série</title>
	<!-- Vue d'ensemble de la série : score de la série et une carte par map (à venir / en cours / terminée, score, vainqueur).
	     Lit match, teams, valorantData et mapsGraphics.series (visibilité).
	     Piloté par le panneau « Maps & transitions » (dashboard/maps-transitions.html). -->
	<link rel="stylesheet" href="../shared/theme.css">
	<link rel="stylesheet" href="../shared/maps.css">
	<style>
		/* Animations d'ambiance (cf. shared/maps.css) */
		.card .img { animation: card-zoom 16s ease-in-out infinite alternate; }
		@keyframes card-zoom { from { transform: scale(1.02); } to { transform: scale(1.1); } }
		.card .pulse { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 50px rgba(94, 196, 255, .55), inset 0 0 0 2px rgba(94, 196, 255, .7); animation: live-glow 2.8s ease-in-out infinite; }
		@keyframes live-glow { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
		/* Reflet : calque 3× plus large que la carte (qui le découpe), déplacé en transform */
		.card .shine { position: absolute; top: 0; bottom: 0; left: 0; width: 300%; pointer-events: none; background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, .16) 50%, transparent 60%); transform: translateX(-80%); animation: card-shine 7s ease-in-out infinite; animation-delay: calc(2.2s + var(--i, 0) * .4s); }
		.card.done .shine { background-image: linear-gradient(105deg, transparent 40%, rgba(245, 196, 69, .28) 50%, transparent 60%); }
		@keyframes card-shine { 0% { transform: translateX(-80%); } 30%, 100% { transform: translateX(13.333%); } }
		.kb-in .card .mn { animation: mn-in .9s var(--kb-ease-out) backwards; animation-delay: calc(.55s + var(--i, 0) * 90ms); }
		@keyframes mn-in { from { opacity: 0; transform: translateY(24px); letter-spacing: .14em; } }
		.kb-settled .card .mn { animation: none; }
		#mid .sc span, .scorebox .v { display: inline-block; }

		/* En-tête : équipes + score de série */
		#head { position: absolute; left: 96px; right: 96px; top: 70px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 36px; }
		.team { display: flex; align-items: center; gap: 20px; min-width: 0; }
		.team.r { flex-direction: row-reverse; text-align: right; }
		.team .nm { font: 400 50px/1 var(--kb-display); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
		.team .bar { width: 8px; height: 70px; flex: 0 0 auto; background: var(--c); transform: skewX(-14deg); box-shadow: 0 0 16px var(--c); }
		#mid { display: flex; flex-direction: column; align-items: center; gap: 6px; }
		#mid .sc { font: 400 96px/1 var(--kb-display); display: flex; gap: 26px; align-items: center; }
		#mid .sc .d { color: var(--kb-gold); font-size: 60px; }
		#mid .sc .lead { color: var(--kb-gold-hi); text-shadow: 0 0 24px rgba(245, 196, 69, .4); }
		#mid .kb-kicker { font-size: 17px; }
		#rule { position: absolute; left: 260px; right: 260px; top: 246px; }

		/* Cartes maps */
		#cards { position: absolute; left: 96px; right: 96px; top: 282px; bottom: 120px; display: flex; justify-content: center; gap: 28px; }
		.card { position: relative; flex: 0 1 380px; min-width: 0; display: flex; flex-direction: column; overflow: hidden;
			background: var(--kb-night-1); border: 1px solid rgba(94, 196, 255, .3);
			clip-path: polygon(var(--kb-cut) 0, 100% 0, 100% calc(100% - var(--kb-cut)), calc(100% - var(--kb-cut)) 100%, 0 100%, 0 var(--kb-cut)); }
		.card .img { position: absolute; inset: 0; background: var(--kb-night-2) center / cover no-repeat; }
		.card .img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4, 6, 26, .55) 0%, rgba(4, 6, 26, .05) 30%, rgba(4, 6, 26, .35) 55%, rgba(4, 6, 26, .95) 82%); }
		.card.upcoming .img { filter: grayscale(.75) brightness(.7); }
		.card.tbd .img { background-image: url('../shared/img/poster-art.webp'); filter: grayscale(.4) brightness(.5); }
		.card .top { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 22px 24px 0; }
		.card .num { font: 700 18px var(--kb-ui); letter-spacing: .3em; color: var(--kb-gold); text-transform: uppercase; }
		.st { font: 700 14px var(--kb-ui); letter-spacing: .22em; text-transform: uppercase; padding: 5px 12px; border-radius: 4px; background: rgba(4, 6, 26, .7); color: var(--kb-muted); border: 1px solid var(--kb-line); }
		.st.live { background: var(--kb-red); color: #fff; border-color: var(--kb-red); }
		.st.live::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #fff; margin-right: 8px; vertical-align: 1px; animation: blink 1.2s infinite; }
		@keyframes blink { 50% { opacity: .2; } }
		.st.done { color: var(--kb-gold-hi); border-color: var(--kb-gold-dim); }
		.card .bottom { position: relative; margin-top: auto; padding: 0 24px 24px; }
		.card .mn { font: 400 72px/1 var(--kb-display); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; text-shadow: 0 6px 24px rgba(0, 0, 0, .6); }
		.card .pick { margin-top: 6px; font: 600 15px var(--kb-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--kb-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.card .pick b { color: var(--kb-text); font-weight: 700; }
		.card .pick b.dec { color: var(--kb-gold-hi); }
		.scorebox { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--kb-line); }
		.scorebox .s { display: flex; align-items: center; gap: 10px; min-width: 0; }
		.scorebox .s.r { flex-direction: row-reverse; }
		.scorebox .tg { font: 700 22px var(--kb-num); letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
		.scorebox .v { font: 400 54px/1 var(--kb-display); }
		.scorebox .dash { color: var(--kb-gold); font: 400 30px var(--kb-display); }
		.scorebox .lose { opacity: .45; }
		.scorebox .v.win { color: var(--kb-gold-hi); text-shadow: 0 0 18px rgba(245, 196, 69, .45); }
		.wintag { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; padding: 8px 10px; background: linear-gradient(90deg, transparent, rgba(245, 196, 69, .22), transparent); font: 700 16px var(--kb-ui); letter-spacing: .24em; text-transform: uppercase; color: var(--kb-gold-hi); white-space: nowrap; overflow: hidden; }
		.wintag span { overflow: hidden; text-overflow: ellipsis; }
		.wintag::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 30%; --sw: 30; background: linear-gradient(90deg, transparent, rgba(255, 230, 160, .5), transparent); transform: translateX(-100%); animation: kbm-sweep-w 4.5s ease-in-out infinite; animation-delay: 2.6s; }
		.card.done { border-color: var(--kb-gold-dim); }
		.card.done::after { content: ''; position: absolute; inset: 0; border: 2px solid var(--kb-gold); pointer-events: none; opacity: .55; }
		.card.live { border-color: var(--kb-blue-hi); box-shadow: 0 0 40px var(--kb-blue-glow); }
		.card.live::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--kb-blue-hi); box-shadow: 0 0 20px var(--kb-blue-glow); }
		.card .wait { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--kb-line); font: 600 16px var(--kb-ui); letter-spacing: .24em; text-transform: uppercase; color: var(--kb-muted); text-align: center; }
		.many .card .mn { font-size: 54px; }
		.many .scorebox .v { font-size: 44px; }
		.many .scorebox .tg { font-size: 18px; }

	</style>
</head>
<body>
	<div id="scene" class="kb-scene">
		<div class="kb-bg"><div class="kb-bg__art"></div><div class="kb-bg__stars"></div><div class="kb-bg__grid"></div><div class="kbm-drift"></div></div>
		<div id="content"></div>
		<div class="kb-frame"></div>
	</div>

	<script src="../shared/kb.js"></script>
	<script src="../shared/maps.js"></script>
	<script>
		const $ = (s) => document.querySelector(s);
		const sceneEl = $('#scene');
		const scene = KB.scene(sceneEl, { settleMs: 3200 });
		const seen = new Map();
		const esc = KB.esc;
		const STATUS = { upcoming: 'À venir', live: 'En cours', done: 'Terminée' };

		function card(e, i, match, sides) {
			const n = i + 1;
			if (!e || !e.map) {
				return `<div class="card tbd kbm-wipe" style="--i:${3 + i}"><div class="img"></div>
					<div class="top"><div class="num">Map ${n}</div><div class="st">À venir</div></div>
					<div class="bottom"><div class="mn">À définir</div><div class="pick">Veto en attente</div></div></div>`;
			}
			const m = KB.map(e.map);
			const st = e.status === 'done' || e.winner ? 'done' : e.status === 'live' ? 'live' : 'upcoming';
			const name = (m && m.name) || e.map;
			let pick = '';
			if (e.pickedBy === 'A' || e.pickedBy === 'B') { const t = KBM.teamOf(e.pickedBy, match); pick = `Pick <b>${esc(t ? t.tag || t.name : 'Équipe ' + e.pickedBy)}</b>`; }
			else if (e.pickedBy === 'decider') pick = `<b class="dec">Decider</b>`;
			const w = KBM.winnerOf(e);
			let body;
			if (st === 'upcoming') {
				body = `<div class="wait">Prochainement</div>`;
			} else {
				const side = (key, cls) => {
					const t = KBM.teamOf(key, match);
					const res = w ? (w === key ? 'win' : 'lose') : '';
					return `<div class="s ${cls} ${res}">${KB.teamLogo(t, 34)}${t ? `<div class="tg">${esc(t.tag || t.name)}</div>` : ''}</div>`;
				};
				const val = (key) => { const v = key === 'A' ? e.scoreA : e.scoreB; const res = w ? (w === key ? 'win' : 'lose') : ''; return `<span class="v ${res}" data-k="sc-${i}-${key}">${esc(v ?? 0)}</span>`; };
				body = `<div class="scorebox">${side(sides.leftKey, '')}<div style="display:flex;gap:10px;align-items:center">${val(sides.leftKey)}<span class="dash">–</span>${val(sides.rightKey)}</div>${side(sides.rightKey, 'r')}</div>`;
				if (w) { const t = KBM.teamOf(w, match); body += `<div class="wintag">${KB.teamLogo(t, 26)}<span>${esc(t ? t.name : 'Équipe ' + w)}</span></div>`; }
			}
			const img = m && (m.listViewTall || m.splash);
			const fs = name.length > 7 ? `style="font-size:${Math.max(40, Math.floor(480 / name.length))}px"` : '';
			return `<div class="card ${st} kbm-wipe" style="--i:${3 + i}">
				<div class="img" style="${img ? `background-image:url('${esc(img)}')` : ''}"></div>
				<div class="top"><div class="num">Map ${n}</div><div class="st ${st}">${STATUS[st]}</div></div>
				<div class="shine"></div>${st === 'live' ? '<div class="pulse"></div>' : ''}
				<div class="bottom"><div class="mn" ${fs}>${esc(name)}</div><div class="pick">${pick || '&nbsp;'}</div>${body}</div></div>`;
		}

		function render() {
			const match = KB.rep.match.value || {};
			const sides = KB.sides(match);
			const { left, right, leftKey, rightKey } = sides;
			const s = KB.seriesScore(match);
			const maps = (match.maps || []).slice();
			const total = Math.max(maps.length, KB.winsNeeded(match.format) * 2 - 1);
			while (maps.length < total) maps.push(null);
			const teamHtml = (t, key, cls) => `<div class="team ${cls} kb-anim kb-anim--${cls === 'r' ? 'right' : 'left'}" style="--i:1;--c:${esc(KB.teamColor(t, key))}">
				<div class="bar"></div>${KB.teamLogo(t, 84)}<div class="nm">${esc(t ? t.name : 'À déterminer')}</div></div>`;
			const lead = s[leftKey] > s[rightKey] ? 'l' : s[rightKey] > s[leftKey] ? 'r' : '';
			const clinched = Math.max(s.A, s.B) >= KB.winsNeeded(match.format);
			// Même nombre de maps : mise à jour en place (le zoom des cartes et les reflets continuent)
			KBM.patch($('#content'), `
				<div id="head">
					${teamHtml(left, leftKey, 'l')}
					<div id="mid" class="kb-anim kb-anim--pop" style="--i:0">
						<div class="kb-kicker">${esc(KB.joinDot(match.stage || 'Match', KB.formatLabel(match.format)))}</div>
						<div class="sc"><span class="${lead === 'l' ? 'lead' : ''}" data-k="sl">${s[leftKey]}</span><span class="d">–</span><span class="${lead === 'r' ? 'lead' : ''}" data-k="sr">${s[rightKey]}</span></div>
						<div class="kb-label">${clinched ? 'Série terminée' : 'Score de la série'}</div>
					</div>
					${teamHtml(right, rightKey, 'r')}
				</div>
				<div id="rule" class="kb-rule kb-rule--gold kbm-sweep kb-anim" style="--i:2"></div>
				<div id="cards" class="${total > 3 ? 'many' : ''}">${maps.map((e, i) => card(e, i, match, sides)).join('')}</div>
				<div class="kbm-partners kb-anim" style="--i:9"><img src="${KB.img.kbs}" alt="">KB SERIES · Présenté par <img src="${KB.img.cycom}" alt=""> · Édition spéciale <img src="${KB.img.epitech}" alt="" style="height:30px"></div>`, total);
			KBM.flashChanges(sceneEl, seen);
		}

		KB.watch(['match', 'teams', 'valorantData', KBM.rep()], () => {
			scene.set(!!KBM.cfg().series.visible, render);
		});
	</script>
</body>
</html>
