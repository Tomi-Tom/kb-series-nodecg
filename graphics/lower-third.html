<!DOCTYPE html>
<html lang="fr" class="kb-graphic">
<head>
<meta charset="utf-8">
<title>Lower thirds</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
	/* Deux lower thirds indépendants : bas-gauche et bas-droite (au-dessus du ticker, à l'écart de la barre de compétences). */
	.lt { position: absolute; bottom: 136px; display: flex; align-items: center; visibility: hidden; --accent: var(--kb-blue-hi); --accent-glow: var(--kb-blue-glow); }
	.lt.left { left: 64px; }
	.lt.right { right: 64px; flex-direction: row-reverse; }
	.lt.gold { --accent: var(--kb-gold-hi); --accent-glow: rgba(245, 196, 69, .45); }
	.lt.alert { --accent: var(--kb-red); --accent-glow: rgba(255, 70, 85, .5); }

	/* Médaillon : entre en pivotant, puis flotte doucement */
	.badge { width: 128px; height: 128px; flex: 0 0 auto; display: grid; place-items: center; position: relative; z-index: 2; perspective: 600px; }
	.left .badge { margin-right: -22px; } .right .badge { margin-left: -22px; }
	.badge-in { width: 100%; height: 100%; display: grid; place-items: center; transform: rotateY(-100deg) scale(.6); opacity: 0; }
	.kb-in .badge-in { animation: badge-in .9s var(--kb-ease-out) .05s forwards, badge-float 5s ease-in-out 1s infinite; }
	.kb-out .badge-in { animation: badge-out .3s ease forwards; }
	@keyframes badge-in { 60% { opacity: 1; transform: rotateY(20deg) scale(1.05); } 100% { opacity: 1; transform: none; } }
	@keyframes badge-float { 0%, 100% { opacity: 1; transform: none; } 50% { opacity: 1; transform: translateY(-4px) rotateY(12deg); } }
	@keyframes badge-out { from { opacity: 1; } to { opacity: 0; transform: scale(.7) rotateY(80deg); } }
	.badge img { width: 128px; height: 128px; object-fit: contain; filter: drop-shadow(0 6px 18px rgba(0, 0, 0, .65)); }
	.badge .halo { position: absolute; inset: 14px; border-radius: 50%; background: radial-gradient(circle, var(--accent-glow), transparent 70%); animation: halo 3.2s ease-in-out infinite; z-index: -1; }
	@keyframes halo { 0%, 100% { transform: scale(.85); opacity: .5; } 50% { transform: scale(1.15); opacity: 1; } }
	.badge .warn { width: 96px; height: 96px; display: grid; place-items: center; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); background: linear-gradient(135deg, var(--kb-red), #8a1424); font: 400 56px var(--kb-display); color: #fff; animation: warn-pulse 1.6s ease-in-out infinite; }
	@keyframes warn-pulse { 50% { filter: brightness(1.25); transform: scale(1.06); } }

	/* Volet : révélation par clip-path + barre lumineuse qui balaye */
	.reveal { position: relative; transition: clip-path .7s var(--kb-ease-out) .15s; }
	.left .reveal { clip-path: inset(0 100% 0 0); }
	.right .reveal { clip-path: inset(0 0 0 100%); }
	.kb-in .reveal { clip-path: inset(0 0 0 0); }
	.kb-out.left .reveal { clip-path: inset(0 100% 0 0); transition: clip-path .3s var(--kb-ease-inout); }
	.kb-out.right .reveal { clip-path: inset(0 0 0 100%); transition: clip-path .3s var(--kb-ease-inout); }
	.wipe { position: absolute; top: 0; bottom: 0; width: 6px; z-index: 3; background: #fff; box-shadow: 0 0 18px 6px var(--accent); opacity: 0; pointer-events: none; }
	.left .wipe { left: 0; } .right .wipe { right: 0; }
	.kb-in.left .wipe { animation: wipe-l .75s var(--kb-ease-out) .15s; }
	.kb-in.right .wipe { animation: wipe-r .75s var(--kb-ease-out) .15s; }
	@keyframes wipe-l { 0% { opacity: 1; left: 0; } 85% { opacity: 1; } 100% { opacity: 0; left: 100%; } }
	@keyframes wipe-r { 0% { opacity: 1; right: 0; } 85% { opacity: 1; } 100% { opacity: 0; right: 100%; } }

	.body { --kb-cut: 22px; position: relative; overflow: hidden; min-width: 440px; max-width: 700px; padding: 16px 56px 18px 46px; border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
	.right .body { padding: 16px 46px 18px 56px; text-align: right; clip-path: polygon(0 0, calc(100% - var(--kb-cut)) 0, 100% var(--kb-cut), 100% 100%, var(--kb-cut) 100%, 0 calc(100% - var(--kb-cut))); }
	.body::before { content: ''; position: absolute; top: 0; bottom: 0; width: 6px; background: var(--accent); box-shadow: 0 0 16px var(--accent-glow); animation: bar-breathe 2.8s ease-in-out infinite; }
	.left .body::before { left: 0; } .right .body::before { right: 0; }
	@keyframes bar-breathe { 50% { box-shadow: 0 0 28px 2px var(--accent-glow); filter: brightness(1.3); } }
	/* Reflet qui traverse le panneau en boucle */
	.body::after { content: ''; position: absolute; top: 0; bottom: 0; width: 30%; left: -40%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .09), transparent); transform: skewX(-20deg); animation: sweep 6s ease-in-out 1.6s infinite; }
	@keyframes sweep { 0% { left: -40%; } 35%, 100% { left: 130%; } }
	.gold .body { background: linear-gradient(160deg, rgba(60, 48, 20, .55), rgba(10, 15, 46, .92) 55%); }
	.alert .body { background: linear-gradient(160deg, rgba(90, 16, 30, .6), rgba(10, 15, 46, .92) 55%); }
	.right.gold .body { background: linear-gradient(200deg, rgba(60, 48, 20, .55), rgba(10, 15, 46, .92) 55%); }
	.right.alert .body { background: linear-gradient(200deg, rgba(90, 16, 30, .6), rgba(10, 15, 46, .92) 55%); }

	.kicker { display: flex; align-items: center; gap: 12px; font: 700 15px var(--kb-ui); letter-spacing: .3em; text-transform: uppercase; color: var(--kb-gold); }
	.right .kicker { flex-direction: row-reverse; }
	.kicker::after { content: ''; width: 70px; height: 2px; background: linear-gradient(90deg, var(--kb-gold), transparent); transform-origin: left; transform: scaleX(0); }
	.right .kicker::after { background: linear-gradient(270deg, var(--kb-gold), transparent); transform-origin: right; }
	.kb-in .kicker::after { animation: grow .6s var(--kb-ease-out) .7s forwards; }
	@keyframes grow { to { transform: scaleX(1); } }
	.gold .kicker span { padding: 3px 14px; border-radius: 6px; background: linear-gradient(180deg, #d8c287, var(--kb-gold)); color: #1a1430; }
	.alert .kicker span { padding: 3px 14px; border-radius: 6px; background: var(--kb-red); color: #fff; }
	.alert .kicker::after { background: linear-gradient(90deg, var(--kb-red), transparent); }
	.right.alert .kicker::after { background: linear-gradient(270deg, var(--kb-red), transparent); }

	.title { margin-top: 4px; font: 400 56px/1.12 var(--kb-display); text-transform: uppercase; letter-spacing: .015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.gold .title .tx { background: linear-gradient(100deg, var(--kb-gold) 0%, #fff3cf 20%, var(--kb-gold-hi) 40%, var(--kb-gold) 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: gold-shimmer 5s linear infinite; }
	@keyframes gold-shimmer { from { background-position: 100% 0; } to { background-position: -150% 0; } }
	.sub { margin-top: 8px; font: 600 20px var(--kb-ui); letter-spacing: .12em; color: rgba(243, 241, 234, .85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.sub:empty { display: none; }
	.rule { position: absolute; left: 30px; right: 30px; bottom: 0; height: 3px; transform: scaleX(0); }
	.left .rule { transform-origin: left; } .right .rule { transform-origin: right; }
	.kb-in .rule { animation: grow .8s var(--kb-ease-out) .55s forwards; }
	.lt .kb-anim { --d: .4s; }
</style>
</head>
<body>
	<div class="lt left" id="lt-left"></div>
	<div class="lt right" id="lt-right"></div>

<script src="../shared/kb.js"></script>
<script src="../shared/live.js"></script>
<script>
	const rep = nodecg.Replicant('liveLowerThird', { defaultValue: LIVE.defaults.liveLowerThird });
	const slots = {};
	for (const side of ['left', 'right']) {
		const el = KB.$('#lt-' + side);
		slots[side] = { side, el, pres: KB.presence(el, 380), key: null, busy: Promise.resolve() };
	}

	function content(v) {
		const style = LIVE.styles[v.style] ? v.style : 'standard';
		let { title, subtitle, kicker } = v;
		if (v.source === 'caster') {
			const c = (KB.rep.casters.value || [])[+v.casterIndex || 0] || {};
			title = c.name || 'Caster';
			subtitle = c.handle || '';
			kicker = kicker || 'Caster';
		}
		return { style, title: title || '', subtitle: subtitle || '', kicker: kicker || LIVE.styles[style].kicker };
	}

	function paint(slot, c) {
		const { el, side } = slot;
		el.className = `lt ${side} ${c.style}`;
		const badge = c.style === 'alert' ? '<div class="warn">!</div>' : `<div class="halo"></div><img src="${KB.img.kbs}" alt="">`;
		const anim = side === 'left' ? 'kb-anim--left' : 'kb-anim--right';
		const ruleStyle = c.style === 'alert' ? 'style="background:linear-gradient(90deg,transparent,var(--kb-red) 15%,#ff8a95 50%,var(--kb-red) 85%,transparent);box-shadow:0 0 12px rgba(255,70,85,.5)"' : '';
		el.innerHTML = `
			<div class="badge"><div class="badge-in">${badge}</div></div>
			<div class="reveal"><div class="body kb-panel">
				<div class="kicker kb-anim ${anim}" style="--i:1"><span>${KB.esc(c.kicker)}</span></div>
				<div class="title kb-anim ${anim}" style="--i:2"><span class="tx">${KB.esc(c.title)}</span></div>
				<div class="sub kb-anim ${anim}" style="--i:3">${KB.esc(c.subtitle)}</div>
			</div>
			<div class="rule kb-rule${c.style === 'gold' ? ' kb-rule--gold' : ''}" ${ruleStyle}></div>
			<div class="wipe"></div></div>`;
		// Titre trop long : on réduit la taille avant l'ellipse
		const t = el.querySelector('.title');
		let size = 56;
		while (t.scrollWidth > t.clientWidth + 1 && size > 34) { size -= 2; t.style.fontSize = size + 'px'; }
	}

	function renderSlot(slot, v) {
		slot.busy = slot.busy.then(async () => {
			const c = content(v);
			const key = JSON.stringify(c);
			const want = !!v.visible && !!(c.title || c.subtitle);
			if (!want) { if (slot.pres.visible) await slot.pres.hide(); slot.key = null; return; }
			if (slot.pres.visible && key === slot.key) return;
			// Même style déjà à l'antenne : mise à jour du texte sur place (fondu court), sans rejouer l'entrée
			if (slot.pres.visible && slot.c && slot.c.style === c.style) {
				await softUpdate(slot, c);
				slot.c = c; slot.key = key;
				return;
			}
			if (slot.pres.visible) await slot.pres.hide(); // changement de style : sortie rapide puis entrée
			paint(slot, c);
			slot.c = c; slot.key = key;
			slot.pres.show();
		});
	}

	async function softUpdate(slot, c) {
		const el = slot.el;
		const parts = [['.kicker span', c.kicker, slot.c.kicker], ['.title .tx', c.title, slot.c.title], ['.sub', c.subtitle, slot.c.subtitle]]
			.map(([sel, val, old]) => ({ node: el.querySelector(sel), val, changed: val !== old }))
			.filter((p) => p.node && p.changed);
		if (!parts.length) return;
		const outs = parts.map((p) => p.node.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-8px)' }], { duration: 160, easing: 'ease-in', fill: 'forwards' }));
		await Promise.all(outs.map((a) => a.finished));
		for (const p of parts) p.node.textContent = p.val;
		const t = el.querySelector('.title');
		t.style.fontSize = '';
		let size = 56;
		while (t.scrollWidth > t.clientWidth + 1 && size > 34) { size -= 2; t.style.fontSize = size + 'px'; }
		// petit éclair sur la barre lumineuse
		const w = el.querySelector('.wipe');
		if (w) w.animate([{ opacity: .9 }, { opacity: 0 }], { duration: 450 });
		const ins = parts.map((p) => p.node.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }));
		outs.forEach((a) => a.cancel()); // l'entrée prend le relais, plus rien ne reste figé (la sortie CSS .kb-out fonctionnera)
		await Promise.all(ins.map((a) => a.finished));
	}

	function render() {
		const v = LIVE.normalizeLowerThird(rep.value);
		renderSlot(slots.left, v.left);
		renderSlot(slots.right, v.right);
	}

	KB.watch(['casters', rep], render);
</script>
</body>
</html>
