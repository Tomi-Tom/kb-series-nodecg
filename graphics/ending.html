<!DOCTYPE html>
<html lang="fr" class="kb-graphic">
<head>
	<meta charset="utf-8">
	<title>KB SERIES — Fin du stream</title>
	<link rel="stylesheet" href="../shared/theme.css">
	<link rel="stylesheet" href="../shared/scenes.css">
	<style>
		.sc-art { opacity: .5; }
		.kb-in .sc-art { animation: sc-art-in-dim 2.2s var(--kb-ease-out) both, sc-drift 24s ease-in-out 2.2s infinite alternate; }
		@keyframes sc-art-in-dim { from { opacity: 0; transform: scale(1.08); } to { opacity: .5; transform: none; } }
		.sc-art-shade { background: linear-gradient(180deg, rgba(4, 6, 26, .25) 0%, rgba(4, 6, 26, .7) 40%, rgba(4, 6, 26, .95) 75%); }

		#head { position: absolute; left: 100px; right: 100px; top: 112px; text-align: center; }
		#kicker { font-size: 22px; }
		#title { margin: 12px auto 0; font-size: 132px; white-space: nowrap; max-width: 1640px; text-shadow: 0 0 40px rgba(78, 170, 255, .35), 0 8px 30px rgba(0, 0, 0, .7); }
		#head .kb-rule { width: 760px; margin: 20px auto 0; }
		#message { margin-top: 18px; font: 600 26px var(--kb-ui); color: var(--kb-muted); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

		/* ---------- Résultats ---------- */
		#resHead { position: absolute; left: 0; right: 0; top: 432px; display: flex; align-items: center; justify-content: center; gap: 30px; padding: 0 560px; }
		#resHead .kb-kicker { white-space: nowrap; color: var(--kb-blue-hi); }
		#results { position: absolute; left: 110px; right: 110px; top: 486px; height: 312px; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 12px 28px; align-content: center; }
		#results.single { grid-template-columns: 1fr; left: 320px; right: 320px; }
		#results.compact { gap: 8px 28px; }
		.res { position: relative; display: grid; grid-template-columns: 112px 1fr 150px 1fr; align-items: center; padding: 0 22px; min-height: 0; }
		.res .meta { display: flex; flex-direction: column; gap: 2px; }
		.res .time { font: 700 26px/1 var(--kb-num); color: var(--kb-blue-hi); }
		.res .lbl { font: 600 12px/1.2 var(--kb-ui); letter-spacing: .14em; color: var(--kb-gold); text-transform: uppercase; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
		.res .tm { display: flex; align-items: center; gap: 14px; min-width: 0; }
		.res .tm.r { flex-direction: row-reverse; text-align: right; }
		.res .nm { flex: 1; min-width: 0; font: 400 28px/1.3 var(--kb-display); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.res .tm.lose .nm { color: var(--kb-muted); }
		.res .tm.lose .sc-logo { opacity: .55; filter: grayscale(.6); }
		.res .sc { text-align: center; font: 400 44px/1 var(--kb-display); white-space: nowrap; }
		.res .sc .w { color: var(--kb-gold-hi); text-shadow: 0 0 18px rgba(245, 196, 69, .35); }
		.res .sc .l { color: var(--kb-muted); }
		.res .sc i { font-style: normal; color: var(--kb-muted); font-size: .6em; margin: 0 10px; vertical-align: middle; }
		#empty { position: absolute; left: 0; right: 0; top: 590px; text-align: center; font: 400 54px var(--kb-display); text-transform: uppercase; color: var(--kb-muted); letter-spacing: .04em; display: none; }

		/* ---------- Prochain rendez-vous ---------- */
		#nextWrap { position: absolute; left: 0; right: 0; top: 816px; display: flex; justify-content: center; }
		#next { position: relative; overflow: hidden; min-width: 980px; max-width: 1500px; display: flex; align-items: center; justify-content: center; gap: 22px; padding: 16px 90px; }
		#next .k { color: var(--kb-gold); font-size: 18px; letter-spacing: .3em; white-space: nowrap; }
		#next .v { color: var(--kb-blue-hi); font-size: 30px; letter-spacing: .14em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 14px var(--kb-blue-glow); }
		#next.hidden { display: none; }

		/* ---------- Bas : partenaires + logo ---------- */
		#bottom { position: absolute; left: 140px; right: 140px; bottom: 48px; height: 128px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
		#bottom .sc-partner:first-child { justify-self: start; }
		#bottom .sc-partner:last-child { justify-self: end; }
		#bottom .sc-cycom { height: 90px; }
		#bottom .sc-epitech { height: 42px; }
		#kbs { height: 128px; }
	</style>
</head>
<body>
	<div class="sc-stage" id="stage">
		<div class="kb-bg"><div class="kb-bg__grid"></div></div>
		<div class="sc-glow" style="top:60px;opacity:.6"></div>
		<div class="sc-art"></div>
		<div class="kb-bg__stars"></div>
		<div class="sc-art-shade"></div>
		<div class="kb-frame sc-frame" style="top:28px !important"></div>

		<div id="head">
			<div class="kb-kicker kb-anim" id="kicker" style="--i:0"></div>
			<div class="kb-title sc-wipe" id="title" style="--i:1"><span class="sc-gleam" id="titleText"></span></div>
			<div class="kb-rule kb-rule--gold kb-anim" style="--i:3"></div>
			<div class="kb-anim" id="message" style="--i:4"></div>
		</div>

		<div id="resHead">
			<span class="sc-wing" style="--i:5"></span>
			<span class="kb-kicker kb-anim" style="--i:5" id="resTitle">Résultats du jour</span>
			<span class="sc-wing sc-wing--r" style="--i:5"></span>
		</div>
		<div id="results"></div>
		<div id="empty" class="kb-anim" style="--i:6">Les résultats arrivent bientôt</div>

		<div id="nextWrap" class="kb-anim kb-anim--pop" style="--i:12">
			<div class="kb-trapeze" id="next"><span class="k" id="nextLabel"></span><span class="v" id="nextText"></span><i class="sc-glint"></i></div>
		</div>

		<div id="bottom">
			<div class="sc-partner kb-anim kb-anim--left" style="--i:13"><span class="kb-label">Présenté par</span><img class="sc-cycom" id="cycom" alt="CYCOM"></div>
			<img class="sc-kbs kb-anim kb-anim--pop" id="kbs" style="--i:14" alt="KB SERIES">
			<div class="sc-partner kb-anim kb-anim--right" style="--i:13"><span class="kb-label">Édition spéciale</span><img class="sc-epitech" id="epitech" alt="EPITECH"></div>
		</div>
	</div>

	<script src="../shared/kb.js"></script>
	<script src="../shared/scenes.js"></script>
	<script>
		const S = KBScenes, $ = KB.$, esc = KB.esc;
		const stage = $('#stage');
		$('#kbs').src = KB.img.kbs; $('#cycom').src = KB.img.cycom; $('#epitech').src = KB.img.epitech;
		S.ambient(stage, { after: $('.sc-art-shade') });
		S.shineLogo($('#kbs'));
		let firstRender = true;

		function resultHTML(r, i, anim) {
			const a = KB.team(r.teamA), b = KB.team(r.teamB);
			const sa = Number(r.scoreA) || 0, sb = Number(r.scoreB) || 0;
			const wa = sa > sb, wb = sb > sa;
			const side = (team, win, lose, cls) => `<div class="tm ${cls} ${lose ? 'lose' : ''}"><div class="sc-logo">${KB.teamLogo(team, 52)}</div><div class="nm">${esc(S.teamName(team))}</div></div>`;
			return `<div class="res kb-panel ${anim ? 'kb-anim kb-anim--left' : ''}" style="--i:${6 + i}">
				<div class="meta"><span class="time">${esc(r.time || '')}</span><span class="lbl">${esc(r.label || '')}</span></div>
				${side(a, wa, wb, 'l')}
				<div class="sc"><span class="${wa ? 'w' : wb ? 'l' : ''}">${sa}</span><i>–</i><span class="${wb ? 'w' : wa ? 'l' : ''}">${sb}</span></div>
				${side(b, wb, wa, 'r')}
			</div>`;
		}

		function render() {
			const tx = S.texts().ending;
			$('#kicker').textContent = tx.kicker || '';
			S.setText($('#titleText'), tx.title || '');
			$('#message').textContent = tx.message || '';
			$('#nextLabel').textContent = tx.nextLabel || '';
			$('#nextLabel').style.display = tx.nextLabel ? '' : 'none';
			S.setText($('#nextText'), tx.next || '');
			$('#next').classList.toggle('hidden', !tx.next);

			const done = (KB.rep.schedule.value || []).filter((r) => r.status === 'done').slice(-8);
			const box = $('#results');
			box.classList.toggle('single', done.length <= 3);
			box.classList.toggle('compact', done.length > 6);
			box.style.gridTemplateRows = done.length <= 3 ? `repeat(${Math.max(done.length, 1)}, minmax(0, 92px))` : `repeat(${Math.ceil(done.length / 2)}, 1fr)`;
			box.innerHTML = done.map((r, i) => resultHTML(r, i, firstRender)).join('');
			KB.$$('.res', box).forEach((el, i) => {
				const r = done[i];
				if (S.changed('res' + i, [r.teamA, r.teamB, r.scoreA, r.scoreB, r.label]) && !firstRender) { el.insertAdjacentHTML('beforeend', '<i class="sc-rowflash"></i>'); KB.$$('.sc', el).forEach(S.bump); }
			});
			$('#empty').style.display = done.length ? 'none' : 'block';
			$('#resHead').style.display = done.length ? '' : 'none';
			S.fit($('#title'), 70, true);
			KB.$$('.res .nm', box).forEach((el) => S.fit(el, 20, true));
			firstRender = false;
		}

		KB.watch(['tournament', 'teams', 'schedule', S.rep], render);
		S.enter(stage);
		document.fonts.ready.then(() => S.fit($('#title'), 70, true));
	</script>
</body>
</html>
